<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>النسخ الاحتياطي والاستيراد - اعدادية النجدين</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .box { background: #e8f4fd; padding: 20px; border-radius: 8px; border: 1px solid #b8daff; margin-bottom: 20px; }
        .btn { padding: 12px 25px; font-size: 16px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-backup { background: #28a745; }
        .btn-restore { background: #dc3545; }
        #statusMsg { margin-top: 10px; font-weight: bold; color: #333; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #333;">إدارة النسخ الاحتياطي</h2>
    
    <div class="box">
        <h3>النسخ الاحتياطي للبيانات</h3>
        <p style="font-size: 13px; color: #555;">احفظ نسخة شاملة من جميع بيانات الموظفين وسجلات الحضور بصيغة ملف JSON آمن على جهازك.</p>
        <button class="btn btn-backup" onclick="exportBackup()">تحميل نسخة احتياطية</button>
    </div>

    <div class="box" style="background: #f8d7da; border-color: #f5c6cb;">
        <h3 style="color: #721c24;">استيراد النسخة الاحتياطية</h3>
        <p style="font-size: 13px; color: #721c24;">استعادة البيانات الكاملة من ملف نسخ احتياطي سابق.</p>
        <input type="file" id="importFile" accept=".json" style="margin-bottom: 10px; width: 100%;">
        <button class="btn btn-restore" onclick="importBackup()">استيراد البيانات</button>
        <div id="statusMsg"></div>
    </div>

    <br>
    <a href="index.html" style="color: #007bff; text-decoration: none; font-weight: bold;">← العودة لوحة التحكم الرئيسية</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, writeBatch } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyCfJ5wGmw2BUZbTfPXILVOYjdQQYdDb0VQ",
        authDomain: "school4-management.firebaseapp.com",
        projectId: "school4-management",
        storageBucket: "school4-management.firebasestorage.app",
        messagingSenderId: "157481747196",
        appId: "1:157481747196:web:ee4958d9589b8d01464d79",
        measurementId: "G-G89TZ8CC7Y"
    }));

    const showStatus = (text, color = "#333") => {
        const msg = document.getElementById('statusMsg');
        msg.style.color = color;
        msg.innerText = text;
    };

    window.exportBackup = async () => {
        try {
            showStatus("جاري تجهيز النسخة الاحتياطية الشاملة...", "#007bff");
            let backupData = { employees: {}, attendance: {} };
            
            const empSnap = await getDocs(collection(db, "employees"));
            empSnap.forEach(d => { backupData.employees[d.id] = d.data(); });

            const attSnap = await getDocs(collection(db, "attendance"));
            attSnap.forEach(d => { backupData.attendance[d.id] = d.data(); });

            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            let dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            
            let todayDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Baghdad' });
            dlAnchor.setAttribute("download", `Najdain_School_Backup_${todayDate}.json`);
            
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showStatus("تم تحميل النسخة الاحتياطية بنجاح إلى جهازك!", "green");
        } catch (e) {
            console.error(e);
            showStatus("حدث خطأ أثناء تصدير النسخة الاحتياطية.", "red");
        }
    };

    window.importBackup = async () => {
        const fileInput = document.getElementById('importFile');
        if (!fileInput.files || fileInput.files.length === 0) {
            alert("يرجى اختيار ملف النسخة الاحتياطية (.json) أولاً!");
            return;
        }

        if (!confirm("تحذير: هل أنت متأكد من استيراد هذه النسخة؟ سيتم استعادة وتحديث البيانات في النظام بناءً على الملف.")) {
            return;
        }

        const file = fileInput.files[0];
        showStatus("جاري قراءة الملف وتحليله...", "#007bff");

        const reader = new FileReader();

        reader.onload = async function(event) {
            try {
                const data = JSON.parse(event.target.result);
                let countEmployees = 0;
                let countAttendance = 0;
                
                showStatus("جاري رفع البيانات دفعة واحدة...", "#007bff");

                // استخدام نظام الحزم (Batch) للرفع السريع جداً
                let batch = writeBatch(db);
                let operationCount = 0;

                if (data.employees) {
                    for (let id in data.employees) {
                        let docRef = doc(db, "employees", id);
                        batch.set(docRef, data.employees[id]);
                        countEmployees++;
                        operationCount++;
                        
                        // فايرستور يسمح بحد أقصى 500 عملية في البッチ الواحد
                        if (operationCount >= 400) {
                            await batch.commit();
                            batch = writeBatch(db);
                            operationCount = 0;
                        }
                    }
                }

                if (data.attendance) {
                    for (let id in data.attendance) {
                        let docRef = doc(db, "attendance", id);
                        batch.set(docRef, data.attendance[id]);
                        countAttendance++;
                        operationCount++;

                        if (operationCount >= 400) {
                            await batch.commit();
                            batch = writeBatch(db);
                            operationCount = 0;
                        }
                    }
                }

                // تنفيذ الدفعة الأخيرة المتبقية
                if (operationCount > 0) {
                    await batch.commit();
                }

                showStatus(`تمت الاستعادة بنجاح! (موظفين: ${countEmployees}, سجلات: ${countAttendance})`, "green");
                alert(`تم استيراد واستعادة البيانات بنجاح وبسرعة فائقة!\n- عدد الموظفين: ${countEmployees}\n- عدد سجلات الحضور: ${countAttendance}`);
            } catch (e) {
                console.error(e);
                showStatus("خطأ: الملف غير صالح أو فشل الاتصال.", "red");
                alert("حدث خطأ أثناء استيراد البيانات، تأكد من صحة الملف.");
            }
        };

        reader.onerror = function() {
            showStatus("خطأ في قراءة الملف من الجهاز.", "red");
            alert("فشل في قراءة الملف.");
        };

        reader.readAsText(file);
    };
</script>
</body>
</html>
