<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التسجيل السريع للأسماء - اعدادية النجدين</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-badge { background: #e2f0d9; color: #385723; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 16px; border: 1px solid #b7e1cd; }
        .filter-buttons { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .filter-buttons button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #28a745; color: white; }
        .btn-action { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; margin: 2px; }
        .action-present { background: #28a745; }
        .action-exit { background: #6f42c1; }
        .action-leave { background: #17a2b8; }
        .action-absent { background: #dc3545; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #007bff; text-decoration: none; font-weight: bold; }
        
        /* تنسيق النافذة المنبثقة لاختيار طريقة الإجازة */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-top: 0; color: #333; }
        .modal-btn { display: block; width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; color: white; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← العودة لوحة التحكم الرئيسية</a>
    <h2 style="color:#28a745; text-align:center;">⚡ لوحة التسجيل السريع للأسماء</h2>
    
    <div id="currentDateBadge" class="header-badge">
        📅 اليوم والتاريخ: جاري التحميل...
    </div>

    <div class="filter-buttons">
        <button style="background:#28a745;" onclick="filterCategory('الكل')">الكل</button>
        <button style="background:#343a40;" onclick="filterCategory('مدرس')">مدرس</button>
        <button style="background:#6c757d;" onclick="filterCategory('إداري')">إداري</button>
        <button style="background:#17a2b8;" onclick="filterCategory('موظف')">موظف</button>
        <button style="background:#ffc107; color:#333;" onclick="filterCategory('حارس')">حارس</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن اسم الموظف لتسجيله بسرعة..." onkeyup="searchEmployees()">

    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>التصنيف</th>
                <th>إجراءات الحضور والانصراف</th>
            </tr>
        </thead>
        <tbody id="quickTable">
            <tr><td colspan="3" style="color: #6c757d;">جاري تحميل الأسماء...</td></tr>
        </tbody>
    </table>
</div>

<!-- نافذة اختيار طريقة إدخال الإجازة -->
<div id="leaveModal" class="modal-overlay">
    <div class="modal-content">
        <h3>خيارات تسجيل الإجازة</h3>
        <p id="modalEmpName" style="font-weight: bold; color: #17a2b8;"></p>
        <button class="modal-btn" style="background: #28a745;" onclick="processLeaveChoice('storage')">1. رفع صورة حقيقية (سحابي)</button>
        <button class="modal-btn" style="background: #ffc107; color: #333;" onclick="processLeaveChoice('base64')">2. ضغط وتحويل الصورة مباشرة</button>
        <button class="modal-btn" style="background: #6c757d;" onclick="processLeaveChoice('none')">3. بدون رفع صورة (كتابة السبب فقط)</button>
        <button class="modal-btn" style="background: #dc3545;" onclick="closeLeaveModal()">إلغاء</button>
    </div>
</div>

<!-- عنصر مخفي لفتح الكاميرا أو ألبوم الصور -->
<input type="file" id="leaveImageInput" accept="image/*" style="display: none;" onchange="handleImageSelected(this)">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCfJ5wGmw2BUZbTfPXILVOYjdQQYdDb0VQ",
        authDomain: "school4-management.firebaseapp.com",
        projectId: "school4-management",
        storageBucket: "school4-management.firebasestorage.app",
        messagingSenderId: "157481747196",
        appId: "1:157481747196:web:ee4958d9589b8d01464d79",
        measurementId: "G-G89TZ8CC7Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const baghdadDateStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Baghdad' });
    
    function getFormattedDateString() {
        let d = new Date();
        return d.toLocaleDateString('ar-IQ', { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'Asia/Baghdad' });
    }
    document.getElementById('currentDateBadge').innerText = `📅 اليوم والتاريخ: ${getFormattedDateString()}`;

    let allEmployees = [];
    let currentCategory = 'الكل';
    let activeEmpForLeave = null;
    let selectedLeaveMethod = null;

    async function loadData() {
        try {
            const querySnapshot = await getDocs(collection(db, "employees"));
            allEmployees = [];
            querySnapshot.forEach((docSnap) => {
                allEmployees.push({ id: docSnap.id, ...docSnap.data() });
            });
            allEmployees.sort((a, b) => Number(a.id) - Number(b.id));
            renderTable(allEmployees);
        } catch (error) {
            console.error(error);
            document.getElementById('quickTable').innerHTML = `<tr><td colspan="3" style="color:red;">خطأ في تحميل البيانات</td></tr>`;
        }
    }

    function renderTable(list) {
        let rows = "";
        if (list.length === 0) {
            rows = `<tr><td colspan="3" style="color:#6c757d;">لا توجد أسماء مطابقة</td></tr>`;
        } else {
            list.forEach(emp => {
                rows += `<tr>
                    <td style="font-weight:bold; text-align:right; padding-right:15px;">${emp.name}</td>
                    <td>${emp.type || '-'}</td>
                    <td>
                        <button class="btn-action action-present" onclick="registerStatus('${emp.id}', '${emp.name}', '${emp.type || '-'}', 'حاضر')">حضور</button>
                        <button class="btn-action action-exit" onclick="registerExit('${emp.id}')">انصراف</button>
                        <button class="btn-action action-leave" onclick="openLeaveModal('${emp.id}', '${emp.name}', '${emp.type || '-'}')">مجاز</button>
                        <button class="btn-action action-absent" onclick="registerStatus('${emp.id}', '${emp.name}', '${emp.type || '-'}', 'غائب')">غائب</button>
                    </td>
                </tr>`;
            });
        }
        document.getElementById('quickTable').innerHTML = rows;
    }

    window.filterCategory = (cat) => {
        currentCategory = cat;
        let filtered = cat === 'الكل' ? allEmployees : allEmployees.filter(e => e.type === cat);
        renderTable(filtered);
    };

    window.searchEmployees = () => {
        let keyword = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allEmployees.filter(e => {
            let matchesCat = currentCategory === 'الكل' || e.type === currentCategory;
            let matchesName = e.name.toLowerCase().includes(keyword);
            return matchesCat && matchesName;
        });
        renderTable(filtered);
    };

    // وظيفة تسجيل الحضور / الغياب العادي
    window.registerStatus = async (empCode, empName, empType, status) => {
        let timeNow = new Date().toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Baghdad', hour: '2-digit', minute: '2-digit' });
        let docId = `${baghdadDateStr}_${empCode}`;
        
        try {
            let docRef = doc(db, "attendance", docId);
            let docSnap = await getDoc(docRef);
            let existingExit = docSnap.exists() ? (docSnap.data().exitTime || "-") : "-";

            await setDoc(docRef, {
                empCode: empCode,
                name: empName,
                type: empType,
                date: baghdadDateStr,
                time: status === 'غائب' ? '-' : timeNow,
                exitTime: existingExit,
                status: status,
                reason: status === 'غائب' ? 'غائب' : '-',
                leaveImage: ''
            }, { merge: true });
            
            alert(`تم تسجيل (${status}) للموظف: ${empName} بنجاح!`);
        } catch (error) {
            alert("حدث خطأ أثناء الحفظ");
        }
    };

    // تسجيل وقت الانصراف
    window.registerExit = async (empCode) => {
        let timeNow = new Date().toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Baghdad', hour: '2-digit', minute: '2-digit' });
        let docId = `${baghdadDateStr}_${empCode}`;
        try {
            let docRef = doc(db, "attendance", docId);
            let docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                alert("لم يتم تسجيل حضور هذا الموظف اليوم ليتم تسجيل انصرافه!");
                return;
            }
            await setDoc(docRef, { exitTime: timeNow }, { merge: true });
            alert(`تم تسجيل وقت الانصراف بنجاح (${timeNow})`);
        } catch (error) {
            alert("حدث خطأ أثناء تسجيل الانصراف");
        }
    };

    // إدارة نافذة الإجازة (مربوطة بـ window لضمان العمل من الأزرار)
    window.openLeaveModal = (id, name, type) => {
        activeEmpForLeave = { id, name, type };
        document.getElementById('modalEmpName').innerText = `الموظف: ${name}`;
        document.getElementById('leaveModal').style.display = 'flex';
    };

    window.closeLeaveModal = () => {
        document.getElementById('leaveModal').style.display = 'none';
        activeEmpForLeave = null;
    };

    window.processLeaveChoice = (method) => {
        selectedLeaveMethod = method;
        closeLeaveModal();

        if (method === 'none') {
            saveLeaveToFirebase('');
        } else {
            // فتح مستعرض الملفات أو الكاميرا في الآيباد
            document.getElementById('leaveImageInput').click();
        }
    };

    // التعامل مع الصورة المختارة من جهاز الـ iPad
    window.handleImageSelected = async (inputElement) => {
        if (!inputElement.files || inputElement.files.length === 0) return;
        let file = inputElement.files[0];
        let imageUrl = '';

        alert("جاري معالجة ورفع الصورة، لطفا الانتظار...");

        try {
            if (selectedLeaveMethod === 'storage') {
                // الطريقة الأولى: الرفع لـ Firebase Storage
                let storageRef = ref(storage, `leaves/${baghdadDateStr}_${activeEmpForLeave.id}_${file.name}`);
                let snapshot = await uploadBytes(storageRef, file);
                imageUrl = await getDownloadURL(snapshot.ref);
            } else if (selectedLeaveMethod === 'base64') {
                // الطريقة الثانية: تحويل لـ Base64
                imageUrl = await new Promise((resolve) => {
                    let reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            await saveLeaveToFirebase(imageUrl);
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء رفع الصورة، تأكد من الاتصال أو حجم الملف.");
        }
        inputElement.value = ''; 
    };

    async function saveLeaveToFirebase(imageUrl) {
        if (!activeEmpForLeave) return;
        let docId = `${baghdadDateStr}_${activeEmpForLeave.id}`;
        let reasonText = prompt("أدخل سبب الإجازة أو ملاحظات إضافية (اختياري):") || "إجازة رسمية";

        try {
            await setDoc(doc(db, "attendance", docId), {
                empCode: activeEmpForLeave.id,
                name: activeEmpForLeave.name,
                type: activeEmpForLeave.type,
                date: baghdadDateStr,
                time: '-',
                exitTime: '-',
                status: 'مجاز',
                reason: reasonText,
                leaveImage: imageUrl
            }, { merge: true });

            alert(`تم تسجيل إجازة الموظف (${activeEmpForLeave.name}) بنجاح!`);
        } catch (error) {
            alert("خطأ في حفظ بيانات الإجازة في قاعدة البيانات.");
        }
    }

    loadData();
</script>
</body>
</html>
