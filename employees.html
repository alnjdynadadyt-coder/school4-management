<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الموظفين - اعدادية النجدين</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; }
        .container { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; align-items: center; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; font-size: 14px; }
        input[type="text"] { flex: 1; min-width: 150px; }
        .checkbox-container { display: flex; align-items: center; gap: 5px; font-weight: bold; color: #d9534f; font-size: 14px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #6c757d; color: white; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .btn-edit { background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #007bff; text-decoration: none; font-weight: bold; }
        .badge-skipped { background: #f8d7da; color: #721c24; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-normal { background: #e2f0d9; color: #385723; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* نافذة عرض الصورة المكبرة للموظف */
        .img-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .img-modal-content { max-width: 90%; max-height: 90%; text-align: center; }
        .img-modal-content img { max-width: 100%; max-height: 80vh; border-radius: 8px; border: 3px solid white; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← العودة لوحة التحكم الرئيسية</a>
    <h2 style="color:#6c757d; text-align:center;">👥 إدارة الموظفين والاستثناءات</h2>
    
    <div class="input-group">
        <input type="text" id="newEmpCode" data-old-code="" placeholder="الكود التعريفي">
        <input type="text" id="newEmpName" placeholder="اسم الموظف الكامل">
        <select id="newEmpType">
            <option value="مدرس">مدرس</option>
            <option value="موظف">موظف</option>
            <option value="إداري">إداري</option>
            <option value="حارس">حارس</option>
        </select>
        <label class="checkbox-container">
            <input type="checkbox" id="skipFaceCheck" style="width: 18px; height: 18px;"> استثناء من بصمة الوجه
        </label>
        <button onclick="addEmployee()" style="background:#28a745; color:white; font-weight:bold; width: 100%;">حفظ / تعديل الموظف</button>
    </div>

    <input type="text" id="searchEmpList" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;" placeholder="🔍 ابحث في قائمة الموظفين..." onkeyup="filterEmpList()">

    <table>
        <thead>
            <tr><th>الكود</th><th>الاسم</th><th>التصنيف</th><th>حالة البصمة</th><th>صورة البصمة</th><th>إجراءات</th></tr>
        </thead>
        <tbody id="employeesTable"></tbody>
    </table>
</div>

<!-- نافذة عرض الصورة المكبرة للبصمة -->
<div id="imageViewerModal" class="img-modal-overlay" onclick="closeImageViewer()">
    <div class="img-modal-content">
        <img id="enlargedEmpImg" src="" alt="صورة بصمة الموظف">
        <p style="color: white; margin-top: 10px; font-weight: bold;">اضغط في أي مكان لإغلاق الصورة</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyCfJ5wGmw2BUZbTfPXILVOYjdQQYdDb0VQ",
        authDomain: "school4-management.firebaseapp.com",
        projectId: "school4-management",
        storageBucket: "school4-management.firebasestorage.app",
        messagingSenderId: "157481747196",
        appId: "1:157481747196:web:ee4958d9589b8d01464d79",
        measurementId: "G-G89TZ8CC7Y"
    }));

    window.addEmployee = async () => {
        const oldCode = document.getElementById('newEmpCode').getAttribute('data-old-code');
        const code = document.getElementById('newEmpCode').value.trim();
        const name = document.getElementById('newEmpName').value.trim();
        const type = document.getElementById('newEmpType').value;
        const skipFaceCheck = document.getElementById('skipFaceCheck').checked;
        
        if(code && name) {
            if (oldCode && oldCode !== code) {
                await deleteDoc(doc(db, 'employees', oldCode));
            }
            await setDoc(doc(db, 'employees', code), { name, type, skipFaceCheck }, { merge: true });
            alert("تم حفظ بيانات الموظف بنجاح!");
            
            document.getElementById('newEmpCode').value = '';
            document.getElementById('newEmpName').value = '';
            document.getElementById('skipFaceCheck').checked = false;
            document.getElementById('newEmpCode').setAttribute('data-old-code', '');
        } else {
            alert("يرجى إدخال الكود والاسم بشكل صحيح.");
        }
    };

    window.deleteEmp = async (id) => {
        if(confirm("هل أنت متأكد من حذف هذا الموظف؟")) {
            await deleteDoc(doc(db, 'employees', id));
        }
    };

    let employeesData = [];
    onSnapshot(collection(db, "employees"), snap => {
        employeesData = [];
        snap.forEach(d => {
            employeesData.push({ id: d.id, ...d.data() });
        });
        renderEmployees(employeesData);
    });

    function renderEmployees(list) {
        let rows = "";
        list.forEach(data => {
            let statusBadge = data.skipFaceCheck 
                ? `<span class="badge-skipped">مستثنى من الصورة</span>` 
                : `<span class="badge-normal">يتطلب بصمة وجه</span>`;

            // فحص هل توجد صورة مرجعية مخزنة للموظف
            let imageCell = "<span style='color: #888; font-size: 13px;'>غير مسجل</span>";
            if (data.referenceFace && data.referenceFace.startsWith("data:image")) {
                imageCell = `<button style="background: #ffc107; color: #333; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 12px;" onclick="viewEmpImage('${data.referenceFace}')">🖼️ عرض الصورة</button>`;
            }

            rows += `<tr>
                <td>${data.id}</td>
                <td style="font-weight:bold;">${data.name}</td>
                <td>${data.type}</td>
                <td>${statusBadge}</td>
                <td>${imageCell}</td>
                <td>
                    <button class="btn-edit" onclick="prepareEdit('${data.id}', '${data.name}', '${data.type}', ${Boolean(data.skipFaceCheck)})">تعديل</button> 
                    <button class="btn-del" onclick="deleteEmp('${data.id}')">حذف</button>
                </td>
            </tr>`;
        });
        document.getElementById('employeesTable').innerHTML = rows;
    }

    // دوال عرض وإغلاق نافذة الصورة المكبرة
    window.viewEmpImage = (imgUrl) => {
        document.getElementById('enlargedEmpImg').src = imgUrl;
        document.getElementById('imageViewerModal').style.display = 'flex';
    };

    window.closeImageViewer = () => {
        document.getElementById('imageViewerModal').style.display = 'none';
    };

    window.prepareEdit = (id, name, type, skipFaceCheck) => {
        document.getElementById('newEmpCode').value = id;
        document.getElementById('newEmpCode').setAttribute('data-old-code', id);
        document.getElementById('newEmpName').value = name;
        document.getElementById('newEmpType').value = type;
        document.getElementById('skipFaceCheck').checked = skipFaceCheck;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.filterEmpList = () => {
        const queryVal = document.getElementById('searchEmpList').value.toLowerCase();
        const filtered = employeesData.filter(e => e.name.toLowerCase().includes(queryVal) || e.id.toLowerCase().includes(queryVal));
        renderEmployees(filtered);
    };
</script>
</body>
</html>
