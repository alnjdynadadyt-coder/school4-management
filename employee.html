<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الحضور - اعدادية النجدين</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f7f6; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="text"] { padding: 15px; width: 80%; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; text-align: center; }
        
        /* تصميم زر الكاميرا المرئي والمباشر */
        .camera-box { background: #e8f4fd; border: 2px dashed #007bff; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .camera-box label { display: block; font-weight: bold; color: #007bff; margin-bottom: 8px; cursor: pointer; }
        input[type="file"] { font-size: 14px; width: 100%; cursor: pointer; }

        .btn-reg { padding: 15px; font-size: 16px; color: white; border: none; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        #statusMsg { margin-bottom: 20px; font-weight: bold; padding: 10px; border-radius: 5px; }
        
        /* بطاقة عرض بيانات الموظف */
        .info-card { background: #f8f9fa; border: 1px solid #dcdcdc; border-radius: 10px; padding: 18px; margin-top: 20px; text-align: right; display: none; }
        .info-card h3 { margin-top: 0; color: #007bff; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 18px; }
        .info-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 15px; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .info-label { font-weight: bold; color: #444; }
        .info-value { color: #111; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>تسجيل الحضور اليومي اعدادية النجدين</h2>
    <div id="statusMsg" style="background: #e2f0d9; color: #385723;">جاري التحقق من موقعك وبصمة الجهاز...</div>
    
    <div id="regArea" style="display:none;">
        <input type="text" id="empCode" placeholder="أدخل كود الموظف">
        
        <!-- حقل الكاميرا المرئي والمباشر لضمان فتح الكاميرا الأمامية بضغط المستخدم -->
        <div class="camera-box">
            <label for="livePhotoInput">📷 التقط صورة سيلفي حية مطلوبة للتسجيل:</label>
            <input type="file" id="livePhotoInput" accept="image/*" capture="user">
        </div>

        <button class="btn-reg" style="background:#28a745;" onclick="registerAttendance('attendance')">تسجيل الحضور</button>
        <button class="btn-reg" style="background:#6f42c1;" onclick="registerAttendance('exit')">تسجيل الانصراف</button>
    </div>

    <!-- بطاقة عرض البيانات الفورية للموظف -->
    <div id="employeeCard" class="info-card">
        <h3 id="cardEmpName">---</h3>
        <div class="info-row"><span class="info-label">التاريخ:</span><span class="info-value" id="cardDate">---</span></div>
        <div class="info-row"><span class="info-label">وقت الحضور:</span><span class="info-value" id="cardTime">---</span></div>
        <div class="info-row" id="exitRow" style="display: none;"><span class="info-label">وقت الانصراف:</span><span class="info-value" id="cardExit">---</span></div>
        <div class="info-row"><span class="info-label">الحالة:</span><span class="info-value" id="cardStatus" style="color: #28a745;">---</span></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDoc, doc, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyCfJ5wGmw2BUZbTfPXILVOYjdQQYdDb0VQ",
        authDomain: "school4-management.firebaseapp.com",
        projectId: "school4-management",
        storageBucket: "school4-management.firebasestorage.app",
        messagingSenderId: "157481747196",
        appId: "1:157481747196:web:ee4958d9589b8d01464d79",
        measurementId: "G-G89TZ8CC7Y"
    }));
    const storage = getStorage(app);

    // بصمة الجهاز الفريدة لهذا المتصفح/الهاتف
    let deviceId = localStorage.getItem('school_device_id');
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('school_device_id', deviceId);
    }

    let isLocationVerified = false;
    const SCHOOL_LAT = 31.7296172;
    const SCHOOL_LON = 44.9905462;

    navigator.geolocation.getCurrentPosition(pos => {
        const dist = 6371e3 * 2 * Math.atan2(Math.sqrt(Math.sin(((pos.coords.latitude-SCHOOL_LAT)*Math.PI/180)/2)**2 + Math.cos(SCHOOL_LAT*Math.PI/180)*Math.cos(pos.coords.latitude*Math.PI/180)*Math.sin(((pos.coords.longitude-SCHOOL_LON)*Math.PI/180)/2)**2), Math.sqrt(1 - (Math.sin(((pos.coords.latitude-SCHOOL_LAT)*Math.PI/180)/2)**2 + Math.cos(SCHOOL_LAT*Math.PI/180)*Math.cos(pos.coords.latitude*Math.PI/180)*Math.sin(((pos.coords.longitude-SCHOOL_LON)*Math.PI/180)/2)**2)));
        const msgDiv = document.getElementById('statusMsg');
        
        if (dist <= 30000) { // النطاق المؤقت (30 كم) للتجربة
            isLocationVerified = true; 
            msgDiv.style.background = "#e2f0d9";
            msgDiv.style.color = "#385723";
            msgDiv.innerText = "أهلاً بك، أنت ضمن النطاق المسموح. النظام مؤمن."; 
            document.getElementById('regArea').style.display = "block"; 
        } else { 
            msgDiv.style.background = "#f8f9fa";
            msgDiv.style.color = "#721c24";
            msgDiv.innerText = "عذراً، أنت خارج نطاق المدرسة (المسافة: " + Math.round(dist) + " متر)."; 
        }
    }, () => {
        document.getElementById('statusMsg').innerText = "يرجى السماح بالوصول للموقع الجغرافي (GPS)";
    }, { enableHighAccuracy: true });

    const getLimit = (type, timeInput) => {
        const [h, m] = timeInput.split(':').map(Number);
        const timeVal = h * 60 + m;
        if (type === "حارس") return (timeVal < 12 * 60) ? "07:10" : "17:10";
        if (type === "موظف") return (timeVal < 11 * 60) ? "07:10" : "12:10";
        if (type === "إداري") return "07:40";
        if (type === "مدرس") return "08:10";
        return "08:10";
    };

    window.registerAttendance = async (action) => {
        if (!isLocationVerified) return alert("الموقع غير مؤكد أو أنك خارج النطاق المسموح!");
        
        const code = document.getElementById('empCode').value.trim();
        if (!code) return alert("يرجى إدخال كود الموظف!");

        const photoInput = document.getElementById('livePhotoInput');
        if (!photoInput.files || photoInput.files.length === 0) {
            alert("عذراً، يجب التقاط صورة سيلفي حية للكاميرا لإتمام عملية التسجيل!");
            return;
        }
        const file = photoInput.files[0];

        alert("جاري التحقق من بصمة الجهاز ورفع الصورة الحية، لطفا الانتظار...");

        try {
            // 1. التحقق من وجود الموظف
            const empSnap = await getDoc(doc(db, "employees", code));
            if (!empSnap.exists()) { alert("كود الموظف غير صحيح!"); return; }
            const empData = empSnap.data();

            // 2. فحص صارم: هل هذا الهاتف مستخدم مسبقاً لموظف آخر؟
            const qDev = query(collection(db, "employees"), where("deviceId", "==", deviceId));
            const devSnap = await getDocs(qDev);
            let ownerEmpCode = null;
            devSnap.forEach(d => {
                if (d.id !== code) ownerEmpCode = d.id;
            });

            if (ownerEmpCode) {
                alert("عذراً، هذا الهاتف مسجل بالفعل لموظف آخر (الكود: " + ownerEmpCode + ") ولا يمكن استخدامه لتسجيل كود إضافي!");
                return;
            }

            // 3. فحص بصمة الموظف نفسه (هل كوده مقفل على هاتف غير هذا الهاتف؟)
            if (empData.deviceId && empData.deviceId !== deviceId) {
                alert("عذراً، هذا الكود مسجل ومقفل على جهاز هاتف آخر! يرجى مراجعة الإدارة لفك القفل أولاً.");
                return;
            }

            // رفع الصورة إلى Firebase Storage
            const nowObj = new Date();
            const currentDate = nowObj.toLocaleDateString('en-CA', { timeZone: 'Asia/Baghdad' });
            const currentDayName = nowObj.toLocaleDateString('ar-EG', { weekday: 'long', timeZone: 'Asia/Baghdad' });
            const nowTime = nowObj.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', hour12: false, timeZone: 'Asia/Baghdad' });

            const storageRef = ref(storage, `live_photos/${currentDate}_${code}_${Date.now()}.jpg`);
            const snapshot = await uploadBytes(storageRef, file);
            const livePhotoUrl = await getDownloadURL(snapshot.ref);

            // ربط الكود بهذا الجهاز نهائياً إذا لم يكن مربوطاً
            if (!empData.deviceId) {
                await setDoc(doc(db, "employees", code), { deviceId: deviceId }, { merge: true });
            }

            const qAtt = query(collection(db, "attendance"), where("empCode", "==", code));
            const snapAtt = await getDocs(qAtt);
            let targetDoc = null;
            let existingData = null;

            if (!snapAtt.empty) {
                let docsList = snapAtt.docs.map(d => ({ id: d.id, ...d.data() }));
                docsList.sort((a, b) => new Date(b.date) - new Date(a.date));
                let openRecord = docsList.find(d => !d.exitTime || d.exitTime === "" || d.exitTime === "---");
                if (openRecord) { targetDoc = openRecord; existingData = openRecord; }
                else if (docsList.length > 0 && docsList[0].date === currentDate) { targetDoc = snapAtt.docs.find(d => d.id === docsList[0].id); existingData = docsList[0]; }
            }

            if (action === 'attendance') {
                if (existingData && existingData.date === currentDate && existingData.time && existingData.time !== "" && existingData.time !== "---") {
                    alert("لقد قمت بتسجيل الحضور مسبقاً لهذا اليوم ولا يمكنك تكراره!");
                    return;
                }
                let status = (nowTime > getLimit(empData.type, nowTime)) ? "متأخر" : "حاضر";
                
                await addDoc(collection(db, "attendance"), {
                    empCode: code,
                    name: empData.name,
                    status,
                    time: nowTime,
                    exitTime: "",
                    date: currentDate,
                    day: currentDayName,
                    reason: "-",
                    livePhoto: livePhotoUrl
                });

                alert("تم تسجيل الحضور بنجاح مع الصورة الحية وبصمة الجهاز!");
            } else {
                if (!existingData || (existingData.exitTime && existingData.exitTime !== "")) {
                    alert("لا يوجد سجل حضور مفتوح (يحتاج إلى انصراف) لهذا الكود!");
                    return;
                }
                await setDoc(doc(db, 'attendance', targetDoc.id), { 
                    exitTime: nowTime,
                    exitPhoto: livePhotoUrl
                }, { merge: true });

                alert("تم تسجيل الانصراف بنجاح مع الصورة الحية!");
            }

            location.reload();
        } catch (err) {
            console.error(err);
            alert("حدث خطأ أثناء الاتصال بقاعدة البيانات، تأكد من الإنترنت.");
        }
    };
</script>
</body>
</html>
