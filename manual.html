<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التسجيل اليدوي المفصل - اعدادية النجدين</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; }
        .container { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: auto; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        
        th:nth-child(1), td:nth-child(1) { width: 10%; font-weight: bold; } /* الكود */
        th:nth-child(2), td:nth-child(2) { width: 20%; font-weight: bold; text-align: right; padding-right: 15px; } /* الاسم */
        th:nth-child(9), td:nth-child(9) { width: 130px; }
        td:nth-child(6) input[type="time"] { width: 85px; padding: 5px; font-size: 13px; text-align: center; }

        /* ألوان صفوف الجدول حسب الحالة */
        .status-present { background-color: #d4edda !important; } /* أخضر فاتح */
        .status-late { background-color: #fff3cd !important; }    /* أصفر فاتح */
        .status-leave { background-color: #cce5ff !important; }   /* أزرق فاتح */
        .status-absent { background-color: #f8d7da !important; }  /* أحمر فاتح */

        .btn-edit { background: #ffc107; color: #333; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; margin-left: 3px; }
        .btn-del { background: #ff4d4d; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← العودة لوحة التحكم الرئيسية</a>
    <h2 style="color:#007bff; text-align:center;">📝 التسجيل اليدوي المفصل للحضور (حسب التسلسل)</h2>
    
    <div class="input-group">
        <input type="date" id="dateSelector" onchange="renderTable()">
        <input type="text" id="empCode" placeholder="كود الموظف">
        <select id="status">
            <option>حاضر</option>
            <option>متأخر</option>
            <option>مجاز</option>
            <option>غائب</option>
            <option>منسب</option>
        </select>
        <input type="text" id="reason" placeholder="سبب الغياب أو الملاحظة">
        <input type="time" id="customTime">
        <button id="actionBtn" onclick="saveAttendance()" style="background:#007bff; color:white; font-weight:bold;">تسجيل يدوي</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>الكود</th>
                <th>الاسم</th>
                <th>اليوم</th>
                <th>التاريخ</th>
                <th>الحضور</th>
                <th>الانصراف</th>
                <th>الحالة</th>
                <th>السبب</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, addDoc, setDoc, deleteDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyCfJ5wGmw2BUZbTfPXILVOYjdQQYdDb0VQ",
        authDomain: "school4-management.firebaseapp.com",
        projectId: "school4-management",
        storageBucket: "school4-management.firebasestorage.app",
        messagingSenderId: "157481747196",
        appId: "1:157481747196:web:ee4958d9589b8d01464d79",
        measurementId: "G-G89TZ8CC7Y"
    }));

    const nowObj = new Date();
    const baghdadDate = nowObj.toLocaleDateString('en-CA', { timeZone: 'Asia/Baghdad' });
    const baghdadTime = nowObj.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', hour12: false, timeZone: 'Asia/Baghdad' });

    document.getElementById('dateSelector').value = baghdadDate;
    document.getElementById('customTime').value = baghdadTime;

    let editingId = null;

    const getLimit = (type, timeInput) => {
        const [h, m] = timeInput.split(':').map(Number);
        const timeVal = h * 60 + m;
        if (type === "حارس") return (timeVal < 12 * 60) ? "07:10" : "17:10";
        if (type === "موظف") return (timeVal < 11 * 60) ? "07:10" : "12:10";
        if (type === "إداري") return "07:50";
        if (type === "مدرس") return "08:10";
        return "08:10";
    };

    const getStatusClass = (status) => {
        if (status === "حاضر") return "status-present";
        if (status === "متأخر") return "status-late";
        if (status === "مجاز" || status === "منسب") return "status-leave";
        if (status === "غائب") return "status-absent";
        return "";
    };

    window.renderTable = async () => {
        const date = document.getElementById('dateSelector').value;
        
        const attSnap = await getDocs(query(collection(db, "attendance"), where("date", "==", date)));
        let attMap = {};
        attSnap.forEach(d => {
            attMap[d.data().empCode] = { id: d.id, ...d.data() };
        });

        const empSnap = await getDocs(collection(db, "employees"));
        let employees = [];
        empSnap.forEach(d => {
            employees.push({ id: d.id, ...d.data() });
        });

        employees.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));

        let rows = "";
        employees.forEach(emp => {
            let data = attMap[emp.id];
            if (data) {
                let rowClass = getStatusClass(data.status);
                let isLocked = (data.status === "مجاز" || data.status === "غائب" || data.status === "منسب");
                let exitInputHtml = isLocked 
                    ? `<span style="color:#6c757d; font-weight:bold;">-</span>` 
                    : `<input type="time" onchange="updateExitTime('${data.id}', this.value)" value="${data.exitTime || ''}">`;

                rows += `<tr class="${rowClass}">
                    <td>${emp.id}</td>
                    <td style="text-align: right; padding-right: 15px;">${data.name}</td>
                    <td>${data.day}</td>
                    <td>${data.date}</td>
                    <td>${data.time}</td>
                    <td>${exitInputHtml}</td>
                    <td>${data.status}</td>
                    <td>${data.reason || ''}</td>
                    <td>
                        <button class="btn-edit" onclick="editAtt('${data.id}', '${data.empCode}', '${data.status}', '${data.time}', '${data.reason || ''}')">تعديل</button>
                        <button class="btn-del" onclick="deleteAtt('${data.id}')">حذف</button>
                    </td>
                </tr>`;
            }
        });

        document.getElementById('attendanceTable').innerHTML = rows || `<tr><td colspan="9" style="color: #6c757d;">لا توجد سجلات حضور لهذا التاريخ</td></tr>`;
    };

    window.updateExitTime = async (id, time) => { 
        await setDoc(doc(db, 'attendance', id), { exitTime: time }, { merge: true }); 
    };

    window.editAtt = (id, code, status, time, reason) => {
        editingId = id;
        document.getElementById('empCode').value = code;
        document.getElementById('status').value = status;
        document.getElementById('reason').value = reason;
        if(time && time !== '-') {
            document.getElementById('customTime').value = time;
        }
        const btn = document.getElementById('actionBtn');
        btn.innerText = "تحديث البيانات";
        btn.style.background = "#ffc107";
        btn.style.color = "#333";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.saveAttendance = async () => {
        const code = document.getElementById('empCode').value.trim();
        const date = document.getElementById('dateSelector').value;
        const statusRaw = document.getElementById('status').value;
        const timeInput = document.getElementById('customTime').value;
        const reason = document.getElementById('reason').value;

        if(!code) { alert("يرجى إدخال كود الموظف"); return; }

        const empSnap = await getDoc(doc(db, "employees", code));
        if (!empSnap.exists()) { alert("الكود غير موجود في قائمة الموظفين!"); return; }
        
        const empData = empSnap.data();
        let status = statusRaw;
        
        // إذا تم اختيار حاضر أو متأخر، نتحقق من الوقت هل يستحق التأخير أم حاضر
        if (status === "حاضر" || status === "متأخر") {
            status = (timeInput > getLimit(empData.type, timeInput)) ? "متأخر" : "حاضر";
        }

        if (editingId) {
            await setDoc(doc(db, 'attendance', editingId), {
                empCode: code,
                name: empData.name,
                status: status, // اعتماد الحالة المختارة بدقة
                time: (status === "غائب" || status === "مجاز" || status === "منسب") ? "-" : timeInput,
                exitTime: (status === "غائب" || status === "مجاز" || status === "منسب") ? "" : undefined, // تفريغ وقت الانصراف في حال تحولت لحالة خاصة
                reason: reason
            }, { merge: true, silent: true });

            alert("تم تحديث البيانات والحالة بنجاح إلى: " + status);
            resetForm();
        } else {
            const q = query(collection(db, "attendance"), where("empCode", "==", code), where("date", "==", date));
            if (!(await getDocs(q)).empty) { alert("الموظف مسجل بالفعل لهذا اليوم!"); return; }
            
            const targetDateObj = new Date(date);
            const formattedDayName = targetDateObj.toLocaleDateString('ar-EG', {weekday: 'long', timeZone: 'Asia/Baghdad'});

            await addDoc(collection(db, "attendance"), { 
                empCode: code, 
                name: empData.name, 
                status, 
                time: (status === "غائب" || status === "مجاز" || status === "منسب") ? "-" : timeInput, 
                exitTime: "", 
                date, 
                day: formattedDayName, 
                reason: reason 
            });
            
            alert("تم التسجيل بنجاح كـ: " + status);
            resetForm();
        }
        renderTable();
    };

    function resetForm() {
        editingId = null;
        document.getElementById('empCode').value = '';
        document.getElementById('reason').value = '';
        const btn = document.getElementById('actionBtn');
        btn.innerText = "تسجيل يدوي";
        btn.style.background = "#007bff";
        btn.style.color = "white";
    }

    window.deleteAtt = async (id) => {
        if(confirm("هل أنت متأكد من حذف هذا السجل؟")) {
            await deleteDoc(doc(db, 'attendance', id));
            renderTable();
        }
    };

    renderTable();
</script>
</body>
</html>
